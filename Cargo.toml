[package]
name = "proxy-integrations"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native local-service integrations for Proxy"
repository = "https://github.com/TheProxyCompany/proxy-integrations"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
